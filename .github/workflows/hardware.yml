name: hardware

on:
  push:
    paths:
      - "hw/**"
      - "firmware/bsp/**"
      - ".github/workflows/hardware.yml"
  pull_request:
    paths:
      - "hw/**"
      - "firmware/bsp/**"
      - ".github/workflows/hardware.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that consumes committed files: rule checks, design checks and
  # simulation. See hw/README.md.
  verify:
    name: Verify ${{ matrix.board }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # One board failing should not hide whether the others pass.
    strategy:
      fail-fast: false
      matrix:
        # Both boards are complete and both declare simulation decks; a board
        # that does not says so in its own board.mk and the Makefile holds it
        # to that. This comment described cpu1 mid-build for several months
        # after it stopped being true.
        board: [led12, cpu1]
    env:
      BOARD: ${{ matrix.board }}
    defaults:
      run:
        working-directory: hw

    steps:
      - uses: actions/checkout@v7

      # uv, its Python and the design virtualenv. Keyed on the pins themselves.
      - name: Cache pinned tools
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/uv
            hw/.tools
          key: hw-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hw/Makefile', 'hw/requirements/skidl.lock') }}
          restore-keys: hw-${{ runner.os }}-${{ runner.arch }}-

      # Ubuntu 24.04 ships KiCad 7; we write KiCad 9 files, so use the
      # KiCad 9 PPA. ngspice comes from the archive. The kicad package also
      # provides the pcbnew Python module, which is what fills copper pours.
      - name: Install KiCad 9 and ngspice
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            kicad kicad-symbols kicad-footprints ngspice

      - name: Build the toolchain
        run: make tools

      - name: Tool versions
        run: |
          {
            echo '### Hardware toolchain'
            echo '```'
            make versions
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate the board from source
        run: tools/ci_run.sh "Generate the board from source" make build

      # Placement, routing and the pours, from <board>/layout.py.
      - name: Lay out the board
        run: tools/ci_run.sh "Lay out the board" make layout

      # The design a build describes must not depend on the run.
      - name: Reproducibility
        run: tools/ci_run.sh "Reproducibility" make reproducible

      - name: Nothing reaches the network
        run: tools/ci_run.sh "Nothing reaches the network" make offline

      - name: Design checks
        run: tools/ci_run.sh "Design checks" make check

      # KiCad's own checker, against the PCBWay limits and the board's rules.
      - name: Design rule check
        run: tools/ci_run.sh "Design rule check" make drc

      # The decks take their values from the build, so a component change moves
      # the simulation with it.
      #
      # Through ci_run.sh like every other step, which this one was not: a deck
      # landing outside its band went to the run summary and nowhere else, and
      # a summary needs a browser while an annotation needs only the API. The
      # table still reaches the summary - ci_run.sh prints the output as well
      # as annotating it - so this adds a reader rather than moving one.
      - name: Simulation
        run: |
          set -o pipefail
          {
            echo "### Simulation: ${BOARD}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          status=0
          tools/ci_run.sh "Simulation" make sim | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Renders, 3D model and fab package
        run: tools/ci_run.sh "Renders, 3D model and fab package" make outputs

      # A stable, readable description of the board. Two runs of this are worth
      # comparing by eye in a way two .kicad_pcb files never were.
      - name: What the board is
        run: |
          {
            echo "### ${BOARD}, as a design"
            echo ''
            echo '<details><summary>parts, nets, copper</summary>'
            echo ''
            echo '```'
            python3 tools/fingerprint.py "${BOARD}/elec/layout/default/default.kicad_pcb"
            echo '```'
            echo ''
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      # Rendered with a CSV reader rather than sed: designators are grouped as
      # "C3, C5" and one footprint name contains a comma, so splitting on commas
      # tears both apart.
      - name: Bill of materials
        run: |
          {
            echo "### Bill of materials: ${BOARD}"
            echo ''
            python3 -c '
          import csv, sys
          rows = list(csv.reader(open(sys.argv[1])))
          print("| " + " | ".join(rows[0]) + " |")
          print("|" + "---|" * len(rows[0]))
          for row in rows[1:]:
              print("| " + " | ".join(row) + " |")
          ' "${BOARD}/build/bom.csv"
          } >> "$GITHUB_STEP_SUMMARY"

      # Renders and the 3D model are what a human reviews on the pull request;
      # the gerbers are what gets ordered.
      - name: Upload board outputs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.board }}-board
          path: |
            hw/out/${{ matrix.board }}/**
            hw/${{ matrix.board }}/build/*.csv
            hw/${{ matrix.board }}/build/*.json
            hw/${{ matrix.board }}/elec/layout/default/*.kicad_pcb
            hw/${{ matrix.board }}/elec/layout/default/drc.json
          if-no-files-found: error

  # MCU pin maps against ST's data, and the firmware headers generated from
  # them. Needs no board build, only the KiCad symbol library to cross-check
  # against, so it runs for boards that do not build yet.
  pins:
    name: Pin map ${{ matrix.board }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        board: [cpu1]
    env:
      BOARD: ${{ matrix.board }}
    defaults:
      run:
        working-directory: hw

    steps:
      - uses: actions/checkout@v7

      - name: Cache pinned tools
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/uv
            hw/.tools
          key: hw-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hw/Makefile', 'hw/requirements/skidl.lock') }}
          restore-keys: hw-${{ runner.os }}-${{ runner.arch }}-

      - name: Install KiCad 9 symbols
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends kicad-symbols

      # Not `make tools`: that also demands kicad-cli, pcbnew and ngspice, which
      # this job does not need. `make pins` builds the virtualenv itself.
      - name: Pin map against the silicon
        run: tools/ci_run.sh "Pin map against the silicon" make pins

  # A tag is a deliberate act, so that is when the orderable package is built.
  # It is published as an artifact rather than attached to a release: this
  # workflow does not create anything outward-facing on its own.
  package:
    name: Fab package ${{ matrix.board }}
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        board: [led12]
    env:
      BOARD: ${{ matrix.board }}
    defaults:
      run:
        working-directory: hw

    steps:
      - uses: actions/checkout@v7

      - name: Cache pinned tools
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/uv
            hw/.tools
          key: hw-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hw/Makefile', 'hw/requirements/skidl.lock') }}
          restore-keys: hw-${{ runner.os }}-${{ runner.arch }}-

      - name: Install KiCad 9 and ngspice
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            kicad kicad-symbols kicad-footprints ngspice

      - name: Build the toolchain
        run: make tools

      - name: Build and package
        run: make outputs

      - name: Record what it was built from
        run: |
          {
            echo "board:    ${BOARD}"
            echo "tag:      ${GITHUB_REF_NAME}"
            echo "commit:   ${GITHUB_SHA}"
            echo "built:    $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            make versions
          } > "out/${BOARD}/BUILT_FROM.txt"
          python3 tools/fingerprint.py "${BOARD}/elec/layout/default/default.kicad_pcb" \
            > "out/${BOARD}/design.txt"

      - name: Upload fab package
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.board }}-fab-${{ github.ref_name }}
          path: hw/out/${{ matrix.board }}/**
          if-no-files-found: error
