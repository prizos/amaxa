name: hardware

on:
  push:
    paths:
      - "hw/**"
      - ".github/workflows/hardware.yml"
  pull_request:
    paths:
      - "hw/**"
      - ".github/workflows/hardware.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that consumes committed files: rule checks, design checks and
  # simulation. Board generation (atopile) is a separate stage; see hw/README.md.
  verify:
    name: Verify boards
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hw

    steps:
      - uses: actions/checkout@v7

      # uv, its Python and the atopile venv. Keyed on the pins themselves.
      - name: Cache pinned tools
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/uv
            hw/.tools
          key: hw-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hw/Makefile', 'hw/requirements/atopile.lock') }}
          restore-keys: hw-${{ runner.os }}-${{ runner.arch }}-

      # Ubuntu 24.04 ships KiCad 7; atopile writes KiCad 9 files, so use the
      # KiCad 9 PPA. ngspice comes from the archive. The kicad package also
      # provides the pcbnew Python module, which is what fills copper pours.
      - name: Install KiCad 9 and ngspice
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            kicad kicad-symbols kicad-footprints ngspice

      - name: Build the toolchain
        run: make tools

      - name: Tool versions
        run: |
          {
            echo '### Hardware toolchain'
            echo '```'
            make versions
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate the board from source
        run: make build

      # Placement, routing and the ground pour, from led12/layout.py.
      - name: Lay out the board
        run: make layout

      # The design a build describes must not depend on the run.
      - name: Reproducibility
        run: make reproducible

      - name: Design checks
        run: make check

      # KiCad's own checker, against the PCBWay limits and the board's rules.
      - name: Design rule check
        run: make drc

      # The decks take their values from the build, so a component change moves
      # the simulation with it.
      - name: Simulation
        run: |
          {
            echo '### Simulation'
            echo '```'
            make sim
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Renders, 3D model and fab package
        run: make outputs

      # A stable, readable description of the board. Two runs of this are worth
      # comparing by eye in a way two .kicad_pcb files never were.
      - name: What the board is
        run: |
          {
            echo '### The board, as a design'
            echo ''
            echo '<details><summary>parts, nets, copper</summary>'
            echo ''
            echo '```'
            python3 tools/fingerprint.py led12/elec/layout/default/default.kicad_pcb
            echo '```'
            echo ''
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      # Rendered with a CSV reader rather than sed: designators are grouped as
      # "C3, C5" and one footprint name contains a comma, so splitting on commas
      # tears both apart.
      - name: Bill of materials
        run: |
          {
            echo '### Bill of materials'
            echo ''
            python3 -c '
          import csv, sys
          rows = list(csv.reader(open("led12/build/bom.csv")))
          print("| " + " | ".join(rows[0]) + " |")
          print("|" + "---|" * len(rows[0]))
          for row in rows[1:]:
              print("| " + " | ".join(row) + " |")
          '
          } >> "$GITHUB_STEP_SUMMARY"

      # Renders and the 3D model are what a human reviews on the pull request;
      # the gerbers are what gets ordered.
      - name: Upload board outputs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: led12-board
          path: |
            hw/out/led12/**
            hw/led12/build/*.csv
            hw/led12/build/*.json
            hw/led12/elec/layout/default/*.kicad_pcb
            hw/led12/elec/layout/default/drc.json
          if-no-files-found: error

  # A tag is a deliberate act, so that is when the orderable package is built.
  # It is published as an artifact rather than attached to a release: this
  # workflow does not create anything outward-facing on its own.
  package:
    name: Fab package
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hw

    steps:
      - uses: actions/checkout@v7

      - name: Cache pinned tools
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/uv
            hw/.tools
          key: hw-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hw/Makefile', 'hw/requirements/atopile.lock') }}
          restore-keys: hw-${{ runner.os }}-${{ runner.arch }}-

      - name: Install KiCad 9 and ngspice
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            kicad kicad-symbols kicad-footprints ngspice

      - name: Build the toolchain
        run: make tools

      - name: Build, check and package
        run: make outputs

      - name: Record what it was built from
        run: |
          {
            echo "board:    led12"
            echo "tag:      ${GITHUB_REF_NAME}"
            echo "commit:   ${GITHUB_SHA}"
            echo "built:    $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            make versions
          } > out/led12/BUILT_FROM.txt
          python3 tools/fingerprint.py led12/elec/layout/default/default.kicad_pcb \
            > out/led12/design.txt

      - name: Upload fab package
        uses: actions/upload-artifact@v5
        with:
          name: led12-fab-${{ github.ref_name }}
          path: hw/out/led12/**
          if-no-files-found: error
